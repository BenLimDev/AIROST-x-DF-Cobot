pcl_filter_node:
  ros__parameters:
    # Voxel grid - leaf size in meters (1cm cubes)
    voxel_leaf_size: 0.01

    # PassThrough on Z axis (depth from camera, in camera frame)
    # Camera is on the wrist looking forward
    # Keep points between 0.1m and 1.5m from camera
    pass_z_min: 0.1
    pass_z_max: 1.5

    # PassThrough on X axis (left/right crop)
    pass_x_min: -0.5
    pass_x_max: 0.5

    # PassThrough on Y axis (up/down crop)
    pass_y_min: -0.5
    pass_y_max: 0.5

    # Topic names
    input_topic: "/camera/depth_image/points"
    output_topic: "/filtered_points"
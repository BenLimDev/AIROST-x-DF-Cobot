controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    # Publishes the current state of all joints to the /joint_states topic
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    # Controls the main movement of the TM20 Arm
    tm20_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    # Controls the opening/closing of the Gripper
    tm20_gripper_controller:
      type: position_controllers/GripperActionController

# --- Arm Controller Configuration ---
tm20_arm_controller:
  ros__parameters:
    joints:
      - joint_1
      - joint_2
      - joint_3
      - joint_4
      - joint_5
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 100.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    constraints:
      stopped_velocity_tolerance: 0.01
      goal_time: 0.0

# --- Gripper Controller Configuration ---
tm20_gripper_controller:
  ros__parameters:
    joint: joint_8
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    stall_timeout: 1.0
    stall_velocity_threshold: 0.001
    goal_tolerance: 0.01